<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Doctor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0b5ed7, #198754);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }

        .form-card {
            grid-column: 1;
        }

        .result-card {
            grid-column: 2;
            max-height: 600px;
            overflow-y: auto;
        }

        h2 {
            color: #0b5ed7;
            margin-bottom: 20px;
            border-bottom: 2px solid #0b5ed7;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
        }

        textarea {
            min-height: 100px;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #0b5ed7;
            box-shadow: 0 0 5px rgba(11, 94, 215, 0.3);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit {
            background: #0b5ed7;
            color: white;
        }

        .btn-submit:hover {
            background: #0a58ca;
        }

        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-back {
            background: #6c757d;
            color: white;
        }

        .btn-back:hover {
            background: #5a6268;
        }

        .result-content {
            display: none;
        }

        .result-content.active {
            display: block;
        }

        .disclaimer {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .result-text {
            white-space: pre-wrap;
            line-height: 1.6;
            color: #333;
        }

        .loading {
            text-align: center;
            color: #0b5ed7;
            display: none;
        }

        .loading.active {
            display: block;
        }

        .loading-spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0b5ed7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }

        .error.active {
            display: block;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }

            .form-card,
            .result-card {
                grid-column: 1;
            }

            .header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🤖 AI Doctor Assistant</h1>
        <p>Get AI-powered health insights (Not a replacement for professional medical advice)</p>
    </div>

    <div class="content">
        <!-- Form Section -->
        <div class="card form-card">
            <h2>📋 Your Health Concern</h2>
            <form id="aiDoctorForm">
                <div class="form-group">
                    <label for="disease">Disease/Condition</label>
                    <input type="text" id="disease" placeholder="e.g., Headache, Fever, Cough" required>
                </div>

                <div class="form-group">
                    <label for="symptoms">Symptoms</label>
                    <textarea id="symptoms" placeholder="Describe your symptoms in detail..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="medicalHistory">Medical History (Optional)</label>
                    <textarea id="medicalHistory" placeholder="Any past medical conditions, allergies, medications..."></textarea>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-submit" id="submitBtn">Get AI Consultation</button>
                    <button type="button" class="btn-back" onclick="goBack()">Back</button>
                </div>
            </form>
        </div>

        <!-- Results Section -->
        <div class="card result-card">
            <h2>📊 AI Consultation Result</h2>

            <div class="loading" id="loading">
                <div class="loading-spinner"></div>
                <p>Analyzing your symptoms...</p>
            </div>

            <div class="error" id="error"></div>

            <div class="result-content" id="resultContent">
                <div class="disclaimer" id="disclaimer"></div>
                <div class="result-text" id="consultationResult"></div>
            </div>
        </div>
    </div>
</div>

<script src="../api-service.js"></script>
<script>
    const form = document.getElementById('aiDoctorForm');
    const loading = document.getElementById('loading');
    const error = document.getElementById('error');
    const resultContent = document.getElementById('resultContent');
    const consultationResult = document.getElementById('consultationResult');
    const disclaimer = document.getElementById('disclaimer');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const disease = document.getElementById('disease').value.trim();
        const symptoms = document.getElementById('symptoms').value.trim();
        const medicalHistory = document.getElementById('medicalHistory').value.trim();

        // Reset display
        error.classList.remove('active');
        resultContent.classList.remove('active');
        loading.classList.add('active');
        submitBtn.disabled = true;

        try {
            const result = await getAIDoctorConsultation(disease, symptoms, medicalHistory);

            if (result.error) {
                error.textContent = `❌ ${result.error}`;
                error.classList.add('active');
            } else {
                disclaimer.textContent = result.disclaimer;
                consultationResult.textContent = result.consultation;
                resultContent.classList.add('active');
            }
        } catch (err) {
            console.error('Error:', err);
            error.textContent = `❌ Connection error: ${err.message}`;
            error.classList.add('active');
        } finally {
            loading.classList.remove('active');
            submitBtn.disabled = false;
        }
    });

    function goBack() {
        window.location.href = '../doctor-choice.html';
    }
</script>

</body>
</html>
