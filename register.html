<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0b5ed7, #198754);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-box {
            background: #fff;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            color: #0b5ed7;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            margin-top: 12px;
            display: block;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background: #ffc107;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #ffca2c;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        #message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 5px;
            display: none;
            font-weight: bold;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>

<div class="form-box">
    <h2>HealthCare+ Registration</h2>
    <div id="message"></div>

    <form id="registerForm">

        <!-- Name -->
        <label>Full Name</label>
        <input id="name" type="text" required minlength="3" placeholder="Enter your name">

        <!-- Email -->
        <label>Email Address</label>
        <input id="email" type="email" required placeholder="example@email.com">

        <!-- Contact -->
        <label>Contact Number</label>
        <input id="phone" type="tel" pattern="[0-9]{10}" required placeholder="10 digit number">

        <!-- Password -->
        <label>Password</label>
        <input id="password" type="password" required minlength="6" placeholder="Minimum 6 characters">

        <button type="submit" id="submitBtn">Register</button>

    </form>
</div>

<script src="api-service.js"></script>
<script>
    const messageDiv = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    // Check backend connection on page load
    window.addEventListener('load', async () => {
        const isConnected = await checkBackendConnection();
        if (!isConnected) {
            showMessage('⚠️ Backend server not running. Start it with: npm start (in backend folder)', 'info');
        }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        submitBtn.disabled = true;
        submitBtn.textContent = 'Registering...';
        
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const password = document.getElementById('password').value;

        // Reset message
        messageDiv.style.display = 'none';

        // Validation
        if (!name || !email || !phone || !password) {
            showMessage('❌ All fields are required', 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Register';
            return;
        }

        if (phone.length !== 10 || isNaN(phone)) {
            showMessage('❌ Phone must be 10 digits', 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Register';
            return;
        }

        if (password.length < 6) {
            showMessage('❌ Password must be at least 6 characters', 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Register';
            return;
        }

        try {
            const result = await registerUser(name, email, password, phone);

            if (result.user && result.user.id) {
                setCurrentUser(result.user);
                showMessage(`✅ Registration successful! Redirecting...`, 'success');
                
                // Redirect after 2 seconds
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            } else {
                showMessage(`❌ ${result.error || 'Registration failed'}`, 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Register';
            }
        } catch (err) {
            console.error('Registration error:', err);
            showMessage('❌ Connection error. Make sure backend is running on http://localhost:5000', 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Register';
        }
    });

    function showMessage(msg, type) {
        messageDiv.textContent = msg;
        messageDiv.style.display = 'block';
        messageDiv.className = type;
    }
</script>

</body>
</html>
